[package]
name = "fingerprint-client-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "http2", "json", "query", "form", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "time", "sync"] }
tokio-util = { version = "=0.7.18", features = ["io"] }
wreq = { version = "=0.16.1", features = ["json", "query", "form", "cookies", "multipart", "stream", "ws", "socks", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "=0.2.0", features = ["emulation-compression"] }

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
